name: Streak keeper

on:
  schedule:
    # GitHub cron is UTC-only. UK local times map as:
    #   23:00 UK -> 23:00 UTC (GMT) or 22:00 UTC (BST)
    #   23:45 UK -> 23:45 UTC (GMT) or 22:45 UTC (BST)
    # Fire all four UTC slots; skip unless Europe/London hour is 23.
    - cron: '0 22,23 * * *'
    - cron: '45 22,23 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        name: Only run during 23:xx Europe/London on schedule
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule event (${{ github.event_name }}); running."
            exit 0
          fi

          UK_NOW=$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')
          UK_HOUR=$(TZ=Europe/London date +%H)
          echo "UK time: $UK_NOW"

          # Covers both 23:00 and 23:45 UK slots (and modest GitHub cron delay).
          if [ "$UK_HOUR" = "23" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: want 23:xx UK, got hour $UK_HOUR."
          fi

  login:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: state
          # Use run_id to ensure we always save a new cache entry with the updated state
          key: state-${{ runner.os }}-${{ github.run_id }}
          # Restore from the most recent cache with this prefix
          restore-keys: |
            state-${{ runner.os }}-

      - name: Run Practice
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PRACTICE_LANGUAGE: Spanish
          HEADLESS: true
        run: pnpm practice

      - name: Upload practice logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: practice-logs
          path: logs/
          if-no-files-found: ignore
