name: Streak keeper

permissions:
  contents: write

on:
  schedule:
    # Late afternoon/evening slots.
    # NOTE: GitHub drops/delays runs scheduled on popular minutes (e.g. :00/:30),
    # so every slot uses an odd minute. Delays of up to ~1h still occur.
    # 18:00-ish UK time (17/18 UTC accounting for DST)
    - cron: '23 17,18 * * *'
    # 22:00-ish UK time (21 UTC BST / 22 UTC GMT)
    - cron: '41 21 * * *'
    # 23:00-ish UK time (22 UTC BST / 23 UTC GMT)
    - cron: '7 22,23 * * *'
    # 23:30-ish UK time (22:30 UTC BST / 23:30 UTC GMT), a last-chance slot
    - cron: '52 22,23 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: state
          # Use run_id to ensure we always save a new cache entry with the updated state
          key: state-${{ runner.os }}-${{ github.run_id }}
          # Restore from the most recent cache with this prefix
          restore-keys: |
            state-${{ runner.os }}-

      - name: Run Practice
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PRACTICE_LANGUAGE: Spanish
          HEADLESS: true
        run: |
          set -o pipefail
          pnpm practice 2>&1 | tee practice-output.txt

      - name: Upload practice logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-logs
          path: |
            logs/
            practice-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit streak status
        if: always()
        run: |
          echo "# Streak Status" > streak-status.md
          echo "Last run on: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> streak-status.md
          echo "" >> streak-status.md
          if [ -f logs/streak-status.txt ]; then
            echo '```' >> streak-status.md
            cat logs/streak-status.txt >> streak-status.md
            echo '' >> streak-status.md
            echo '```' >> streak-status.md
          else
            status_file=$(find logs -name streak-status.txt 2>/dev/null | head -n 1)
            if [ -n "$status_file" ] && [ -f "$status_file" ]; then
              echo '```' >> streak-status.md
              cat "$status_file" >> streak-status.md
              echo '' >> streak-status.md
              echo '```' >> streak-status.md
            else
              echo "Status: FAILED - no verification result produced" >> streak-status.md
            fi
          fi
          echo "" >> streak-status.md
          echo "## Practice output tail" >> streak-status.md
          echo "" >> streak-status.md
          echo '```text' >> streak-status.md
          if [ -f practice-output.txt ]; then
            tail -n 250 practice-output.txt >> streak-status.md
          else
            echo "No practice output captured" >> streak-status.md
          fi
          echo '```' >> streak-status.md

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add streak-status.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update streak status [skip ci]"

          git push origin HEAD:main || exit 1
