name: Streak keeper

on:
  schedule:
    # 6:00 PM (17:00 UTC for BST / 18:00 UTC for GMT)
    - cron: '0 17,18 * * *'
    # 10:00 PM, 10:30 PM, 11:00 PM, 11:30 PM (21:00-22:30 UTC in BST / 22:00-23:30 UTC in GMT)
    - cron: '0,30 21,22,23 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: state
          # Use run_id to ensure we always save a new cache entry with the updated state
          key: state-${{ runner.os }}-${{ github.run_id }}
          # Restore from the most recent cache with this prefix
          restore-keys: |
            state-${{ runner.os }}-

      - name: Run Practice
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PRACTICE_LANGUAGE: Spanish
          HEADLESS: true
        run: pnpm practice

      - name: Upload practice logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: practice-logs
          path: logs/
          if-no-files-found: ignore
